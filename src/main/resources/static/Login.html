<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Express - Iniciar Sesión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-2xl shadow-sm border border-gray-200 w-full max-w-md p-8 text-center">
    <!-- Nuevo logotipo de Ares Express -->
<div class="flex justify-center mb-4">
    <img src="Logo.jpg" alt="Ares Express Logo" class="w-28 h-28 rounded-full object-cover shadow-md border-2 border-purple-500/30">
</div>

    <h2 class="text-2xl font-bold text-gray-800">Ares Express</h2>
    <p class="text-sm text-gray-500 mt-1 mb-6">Ingrese sus credenciales para acceder</p>

    <form id="formLogin" onsubmit="iniciarSesion(event)" class="space-y-4 text-left">
        <div>
            <label for="correo" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1.5">Correo Electrónico</label>
            <input type="email" id="correo" required placeholder="correo@ejemplo.com" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm focus:outline-none focus:border-[#f97316] focus:bg-white transition">
        </div>

        <div>
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1.5">Contraseña</label>
            <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm focus:outline-none focus:border-[#f97316] focus:bg-white transition">
        </div>

        <button type="submit" class="w-full py-3 bg-[#f97316] hover:bg-[#ea580c] text-white font-semibold rounded-xl shadow-md transition mt-2">
            Iniciar Sesión
        </button>
    </form>

    <div class="text-sm text-gray-500 mt-6">
        ¿Aún no tienes una cuenta? <a href="Registro_Usuario.html" class="text-[#f97316] font-semibold hover:underline">Regístrate aquí</a>
    </div>
</div>

<script>
    // Inicializar iconos de Lucide
    lucide.createIcons();

    const API_LOGIN = 'http://localhost:8080/api/auth/login';

    async function iniciarSesion(event) {
        event.preventDefault();

        const correo = document.getElementById('correo').value.trim();
        const password = document.getElementById('password').value;

        const credenciales = {
            correo: correo,
            password: password
        };

        try {
            const response = await fetch(API_LOGIN, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(credenciales)
            });

            if (response.ok) {
                const usuario = await response.json();

                // Guardar datos esenciales en el almacenamiento local
                localStorage.setItem('correo', usuario.correo);
                localStorage.setItem('nombre', usuario.nombre);
                localStorage.setItem('rol', usuario.rol);

                const rol = (usuario.rol || '').toLowerCase();

                // REGLAS ESTRICTAS DE REDIRECCIÓN SEGÚN ROL
                if (rol === 'admin' || rol === 'administrador' || rol === 'subadmin') {
                    // Los administradores van a su panel de gestión
                    window.location.href = 'Interfaz_Administrador.html';
                } else if (rol === 'repartidor' || rol === 'piloto') {
                    // Los repartidores van a su interfaz de entregas
                    window.location.href = 'repartidor.html';
                } else {
                    // LOS CLIENTES VAN PRIMERO A COMERCIOS (Y al confirmar pedido pasarán a cliente.html)
                    window.location.href = 'comercio.html';
                }

            } else {
                alert('Credenciales incorrectas o usuario no encontrado.');
            }
        } catch (error) {
            console.error('Error al conectar con el servidor:', error);
            alert('No se pudo conectar con el servidor backend.');
        }
    }
</script>

</body>
</html>
