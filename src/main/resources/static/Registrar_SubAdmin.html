<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar SubAdministrador - Ares Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">

<!-- Sidebar de Navegación -->
<aside class="w-72 bg-[#0d1527] text-white flex flex-col justify-between p-6 shadow-lg">
    <div class="space-y-6">
        <div>
            <h1 class="text-2xl font-bold tracking-wide text-white">Ares Express</h1>
            <p class="text-xs text-gray-400 mt-0.5">Admin Panel</p>
        </div>
        <nav class="space-y-2">
            <a href="Interfaz_Administrador.html" class="flex items-center space-x-3 px-4 py-3 text-gray-300 hover:text-white hover:bg-white/5 rounded-xl transition">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span>Panel General</span>
            </a>

            <div class="space-y-1">
                <button class="w-full flex items-center justify-between px-4 py-3 bg-[#f97316] text-white rounded-xl font-medium shadow-md transition">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="shield-alert" class="w-5 h-5"></i>
                        <span class="font-medium">Seguridad y Accesos</span>
                    </div>
                </button>
                <div class="pl-11 space-y-1 py-1">
                    <a href="Registrar_SubAdmin.html" class="block py-2 text-xs text-white font-semibold transition">Registrar SubAdmin</a>
                </div>
            </div>
        </nav>
    </div>
    <div class="pt-6 border-t border-white/10">
        <a href="index.html" onclick="localStorage.clear()" class="flex items-center space-x-3 px-4 py-3 text-red-400 hover:bg-white/5 rounded-xl transition">
            <i data-lucide="log-out" class="w-5 h-5"></i>
            <span class="text-sm font-medium">Cerrar Sesión</span>
        </a>
    </div>
</aside>

<!-- Contenido Principal -->
<div class="flex-1 flex flex-col">
    <!-- Header superior -->
    <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-8 shadow-sm">
        <div class="flex items-center space-x-4">
            <a href="Interfaz_Administrador.html" class="text-gray-400 hover:text-[#f97316] transition flex items-center gap-1 text-sm font-medium">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al Panel
            </a>
            <span class="text-gray-300">|</span>
            <h2 class="text-lg font-semibold text-gray-800">Control de Accesos - Registrar SubAdministrador</h2>
        </div>
        <div class="text-sm font-medium text-gray-600 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200">
            Administrador General
        </div>
    </header>

    <!-- Formulario Principal -->
    <main class="p-8 max-w-4xl w-full mx-auto">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 space-y-6">

            <div class="flex items-center space-x-4 pb-6 border-b border-gray-100">
                <div class="bg-orange-50 text-[#f97316] p-3 rounded-2xl">
                    <i data-lucide="user-plus" class="w-8 h-8"></i>
                </div>
                <div>
                    <h3 class="text-xl font-bold text-gray-800">Registrar Nuevo SubAdministrador</h3>
                    <p class="text-sm text-gray-500 mt-0.5">Ingrese las credenciales corporativas para otorgar acceso al sistema con privilegios limitados.</p>
                </div>
            </div>

            <form id="formSubAdmin" onsubmit="registrarSubAdmin(event)" class="space-y-6">
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Nombre Completo *</label>
                        <input type="text" id="nombre" required placeholder="Ej: Juan Pérez"
                               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#f97316] focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Correo Electrónico *</label>
                        <input type="email" id="correo" required placeholder="Ej: subadmin@aresexpress.com"
                               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#f97316] focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Contraseña Temporal *</label>
                        <input type="password" id="password" required placeholder="••••••••"
                               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#f97316] focus:bg-white transition">
                    </div>
                </div>

                <div class="flex justify-end pt-4">
                    <button type="submit" class="px-6 py-3 bg-[#f97316] hover:bg-orange-600 text-white font-bold text-sm rounded-xl transition shadow-md flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i> Guardar SubAdministrador
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
    lucide.createIcons();

    // Control de Seguridad
    const rolActual = localStorage.getItem('rol');
    if (!rolActual || rolActual.toLowerCase() !== 'admin') {
        alert('Acceso restringido a Administradores.');
        window.location.href = 'index.html';
    }

    async function registrarSubAdmin(event) {
        event.preventDefault();

        const correoAdminActual = localStorage.getItem('correo');

        const data = {
            nombre: document.getElementById('nombre').value.trim(),
            correo: document.getElementById('correo').value.trim(),
            password: document.getElementById('password').value,
            rol: "subadmin",
            activo: true
        };

        try {
            const response = await fetch(`http://localhost:8080/api/admin/registrar-subadmin?correoAdminActual=${encodeURIComponent(correoAdminActual)}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('SubAdministrador guardado exitosamente.');
                document.getElementById('formSubAdmin').reset();
            } else {
                const errorText = await response.text();
                alert('Error al registrar: ' + (errorText || 'Revise las credenciales.'));
            }
        } catch (error) {
            console.error('Error de conexión:', error);
            alert('No se pudo conectar con el servidor backend.');
        }
    }
</script>
</body>
</html>
